[tool.mypy]
exclude = []
mypy_path = ["."]
namespace_packages = true
explicit_package_bases = false

[[tool.mypy.overrides]]
module = [
    "engines.core.*",
    "engines.expression.*",
    "engines.dmn.*",
    "cassandra.*",
    "google.cloud.*",
    "google.cloud.bigquery*",
    "google.cloud.bigtable*",
    "google.cloud.discoveryengine*",
    "wandb*",
    "mlflow*",
    "langwatch*",
    "future_agi*",
    "freeplay*",
    "ddtrace*",
    "openinference.*",
    "agentops*",
]
ignore_missing_imports = true

[tool.ruff]
lint.ignore = ["F401", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
